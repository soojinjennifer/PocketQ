# PocketQ Render Blueprint
#
# 이 파일로 Render 대시보드에서 "New +" → "Blueprint"를 선택하고 이 저장소를 연결하면
# 아래 3개 서비스가 한 번에 생성 제안됩니다(자동 배포는 아님 — 각 서비스의 환경변수를
# 대시보드에서 직접 채워야 최초 배포가 성공합니다, 아래 `docs/DEPLOYMENT.md` 참고).
#
# `sync: false`로 표시된 환경변수는 이 파일에 값을 넣지 않습니다(민감정보라 커밋 금지) —
# Render가 서비스 생성 시 값을 입력하라고 대시보드에서 물어봅니다.
#
# 구성:
# - pocketq-web   : apps/web 정적 사이트 (Vite 빌드 산출물)
# - pocketq-api   : apps/api Express 서버 (컴파일 없이 tsx로 TS를 직접 실행 — 아래 build 스크립트의
#                    ESM 확장자 이슈 회피, 이번 세션에서 직접 재현·확인함)
# - pocketq-cas   : services/cas FastAPI 서버, Private Service(외부 공개 안 함) — CAS 엔드포인트에
#                    인증이 전혀 없어(services/cas/app/main.py) 공개 노출 시 누구나 호출 가능하기 때문

services:
  # ── apps/web: 정적 사이트 ─────────────────────────────────────────────
  - type: web
    name: pocketq-web
    runtime: static
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter shared-types --filter validation --filter web build
    staticPublishPath: apps/web/dist
    envVars:
      # 전부 빌드 타임에 Vite가 번들에 인라인한다(런타임 변경 불가) — 값 바뀌면 재배포 필요.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        # pocketq-api 서비스의 공개 URL(예: https://api.app.groundmoyo.com 또는
        # https://pocketq-api.onrender.com)로 채운다. apps/web보다 먼저 pocketq-api를
        # 만들어 URL을 확정한 뒤 이 값을 채워야 한다.
        sync: false
    routes:
      # SPA 라우팅(React Router) — 존재하지 않는 경로도 전부 index.html로 보내 클라이언트
      # 라우터가 처리하게 한다.
      - type: rewrite
        source: /*
        destination: /index.html
    # 오너가 직접 Render 대시보드에서 app.groundmoyo.com을 Custom Domain으로 연결하고
    # groundmoyo.com DNS에 CNAME 레코드를 추가한다(docs/DEPLOYMENT.md 참고).

  # ── apps/api: Express 서버 ────────────────────────────────────────────
  - type: web
    name: pocketq-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    # `pnpm -F api build`(tsc)로 컴파일한 dist/*.js는 tsconfig의 moduleResolution:"bundler"
    # 설정 때문에 상대 import에 .js 확장자가 없어 Node ESM 로더가 직접 실행하지 못한다
    # (이번 세션에 `node apps/api/dist/server.js`를 직접 실행해 ERR_MODULE_NOT_FOUND로
    # 재현·확인함). 별도 빌드 없이 `tsx`로 TS를 직접 실행해 이 문제를 피한다 — `tsx`는
    # `apps/api/package.json`의 `dependencies`(devDependencies 아님, 이번에 옮김)에 있어
    # 프로덕션 설치에서도 항상 포함된다.
    startCommand: pnpm --filter api start
    envVars:
      # PORT는 선언하지 않는다 — Render가 모든 웹 서비스에 자동으로 주입하고,
      # apps/api/src/config/env.ts가 이미 `process.env.PORT`를 읽는다.
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        # pocketq-web의 최종 공개 URL(커스텀 도메인 연결 후에는 https://app.groundmoyo.com).
        # 로컬 개발도 계속 허용하려면 쉼표로 이어서
        # "https://app.groundmoyo.com,http://localhost:5173" 형태로.
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        # 실제 사용 중인 모델명을 그대로(로컬 .env 참고). 비어 있으면 서버가 기동 시점에
        # 즉시 에러를 던지고 종료한다(이번 세션에 직접 재현·확인함) — 반드시 채울 것.
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CAS_SERVICE_URL
        # pocketq-cas는 Private Service라 Render 내부 네트워크 주소로만 접근 가능하다.
        # 값은 `http://pocketq-cas:10000` 형태(Render의 Private Service 내부 호스트명 규칙 —
        # 정확한 포트/호스트는 pocketq-cas 서비스 생성 후 Render 대시보드의 "Internal
        # Address"에 표시되는 값을 그대로 쓴다). 비워두면 결정론적 스텁으로 자동 폴백하므로
        # (apps/api/src/infrastructure/cas/resolveCasClient.ts), pocketq-cas 준비 전에
        # 먼저 pocketq-api만 배포해도 안전하다.
        sync: false
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
    # 오너가 직접 Render 대시보드에서 api.app.groundmoyo.com(권장) 또는 기본 onrender.com
    # 도메인을 Custom Domain으로 연결한다.

  # ── services/cas: FastAPI(SymPy) 서버, 내부 전용 ─────────────────────
  - type: pserv
    name: pocketq-cas
    runtime: python
    plan: starter
    rootDir: services/cas
    # 이 프로젝트는 requirements.txt가 없고 uv.lock(uv 전용)만 있다 — Render Python
    # 런타임에 uv가 기본 설치돼 있지 않으므로 pip로 uv 자체를 먼저 설치한 뒤 lockfile
    # 그대로 동기화한다(로컬 개발과 완전히 동일한 의존성 버전 보장).
    buildCommand: pip install uv && uv sync --frozen
    # PORT는 선언하지 않는다 — Render가 Private Service에도 동일하게 자동 주입하는
    # 환경변수를 그대로 `--port $PORT`로 전달한다. `app/config.py`의 PORT 기본값(8000)은
    # 실제로는 uvicorn 기동에 쓰이지 않는다(이번 세션 조사로 확인 — CLI 옵션이 항상 우선).
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
