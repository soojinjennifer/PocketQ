[project]
name = "cas-service"
version = "0.1.0"
description = "PocketQ CAS(Computer Algebra System) 검증 서비스 — Phase 1: 등식 변형 동치성 검사만 지원"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sympy>=1.13.0",
    "lark>=1.2.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
